<body>
<aside><div class="brand" id="brand"><b>🏔️ SUMMIT NEXT</b><small>School ERP v0.57</small></div><nav id="nav"></nav></aside>
<main class="main">
  <div class="head"><div><h1 id="title"></h1><div class="muted tiny" id="sub"></div></div>
    <div class="r"><div class="qs noprint"><input id="qs" type="search" autocomplete="off"><div class="qs-r" id="qsr" hidden></div></div><span class="tag labtag" id="lab"></span><div class="langsw" id="lang" role="group" aria-label="Language / ภาษา"></div></div></div>
  <div id="view"></div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>/* SUMMIT School ERP NEXT — pure business engine (no DOM).
 * Works in the browser (window.SummitEngine) and in Node (module.exports) for tests.
 * All money in THB integers. Dates are 'YYYY-MM-DD' strings, months 'YYYY-MM'.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SummitEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const pad = n => String(n).padStart(2, '0');
  const ACTIVE_SEAT = ['approved', 'offered']; // statuses that hold a confirmed/held seat
  const OPEN = ['pending', 'approved', 'offered', 'waitlisted'];

  function dowOf(date) {
    const [y, m, d] = date.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d)).getUTCDay();
  }
  function monthDates(month) {
    const [y, m] = month.split('-').map(Number);
    if (!y || !m) return [];
    const n = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return Array.from({ length: n }, (_, i) => {
      const key = `${y}-${pad(m)}-${pad(i + 1)}`;
      return { key, day: i + 1, dow: new Date(Date.UTC(y, m - 1, i + 1)).getUTCDay() };
    });
  }
  function shiftMonth(month, delta) {
    const [y, m] = month.split('-').map(Number);
    const d = new Date(Date.UTC(y, m - 1 + delta, 1));
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}`;
  }
  function daysBetween(a, b) { // b - a in days
    const p = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
    return Math.round((p(b) - p(a)) / 86400000);
  }
  const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
  const overlaps = (a, b) => toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end);
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function defaultSettings() {
    return {
      lang: 'th', schoolName: 'SUMMIT English Academy',
      // Monthly packages keyed by weekdays per week (owner decision 2026-11-18). Valid for 4- or 5-week months.
      packages: { 2: 2000, 4: 4000 }, perSession: 300, capAtPackage: true,
      // Sunday: booked at least 2 days before (= by Friday of that week) → advance price, else regular.
      sundayAdvance: 250, sundayRegular: 300, sundayAdvanceDays: 2,
      renewalDay: 25, closedDates: [], demoToday: '',
      // Per-level overrides (owner 2026-11-18): secondary monthly 2 days/week = ฿3,200; per session ฿500.
      levelRates: { M46: { packages: { 2: 3200 }, perSession: 500 } },
      // Student code = prefix by school stage + running number (owner 2026-11-18). Pre-K uses the primary prefix.
      codePrefix: { primary: 'P', secondary: 'M', adult: 'A' }, codeDigits: 3,
      // v0.20 live use: receipts SEA-YYMM-0001, numbered per month, never reused (even after a void or a deleted student)
      receiptPrefix: 'SEA', mode: 'live',
      // v0.25 automation policies (owner can change in Settings)
      offerHours: 48,          // a freed seat is held this long for the first child in the queue, then offered to the next
      creditOnLeave: true,     // "ลา" (notified absence) gives 1 make-up credit
      creditOnAbsent: false,   // "ขาด" (no notice) gives no credit unless switched on
      creditDays: 30,          // a credit must be used within this many days of the missed class
      promptPayId: '', promptPayName: ''
    };
  }
  /** Levels (v0.15): PRE, P13, P46, M13, M46, UNI (อุดมศึกษา), ADULT (บุคคลทั่วไป). */
  const LEVELS = ['PRE', 'P13', 'P46', 'M13', 'M46', 'UNI', 'ADULT'];
  const OWNER_PRICED = ['M13', 'UNI', 'ADULT']; // no default price: the owner sets it in Settings, else the approver types it
  const stageOf = level => { const l = String(level || ''); return l.startsWith('M') ? 'secondary' : (l === 'UNI' || l === 'ADULT') ? 'adult' : 'primary'; };
  function codePrefixFor(st, level) {
    const cp = Object.assign({ primary: 'P', secondary: 'M', adult: 'A' }, st.codePrefix || {});
    return String(cp[stageOf(level)] || '').trim();
  }
  /** Next free code for a level: prefix + running number (highest existing number with that prefix + 1). */
  function nextStudentCode(state, level, taken) {
    const prefix = codePrefixFor(state.settings, level), digits = Math.max(1, Number(state.settings.codeDigits) || 3);
    const esc = prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('^' + esc + '(\\d+)$', 'i');
    const used = state.students.map(s => s.code).concat(taken || []);
    let max = 0; used.forEach(c => { const m = re.exec(String(c || '').trim()); if (m) max = Math.max(max, Number(m[1])); });
    const lower = new Set(used.map(c => String(c || '').trim().toLowerCase()));
    let n = max + 1, code;
    do { code = prefix + String(n).padStart(digits, '0'); n++; } while (lower.has(code.toLowerCase()));
    return code;
  }
  /** Package table + per-session rate for a level (falls back to school defaults). */
  function ratesFor(st, level) {
    const o = (st.levelRates || {})[level];
    if (OWNER_PRICED.includes(level) && !(o && (Number(o.perSession) > 0 || Object.keys(o.packages || {}).length)))
      return { packages: {}, perSession: null, unset: true };
    return { packages: (o && o.packages) || st.packages || {}, perSession: (o && Number(o.perSession) > 0) ? Number(o.perSession) : st.perSession };
  }

  function groupById(state, id) { return state.groups.find(g => g.id === id); }
  /** v0.29 a class is off on a date when the school is closed or that class (or the whole day) was cancelled. */
  function classOff(state, groupId, date) {
    if ((state.settings.closedDates || []).includes(date)) return true;
    return (state.cancelledClasses || []).some(c => c.date === date && (!c.groupId || c.groupId === groupId));
  }

  /* ---------- sessions ---------- */
  function normalizeSessions(sessions) {
    const seen = new Set(), out = [];
    for (const s of sessions || []) {
      const k = s.groupId + '|' + s.date;
      if (!seen.has(k)) { seen.add(k); const o = { groupId: s.groupId, date: s.date }; if (s.bookedOn) o.bookedOn = s.bookedOn; if (s.makeup) o.makeup = true; if (s.sub) o.sub = true; out.push(o); }
    }
    return out.sort((a, b) => a.date.localeCompare(b.date) || a.groupId.localeCompare(b.groupId));
  }

  /** slots: [{groupId, dow}] → every open date of that weekday in the month (4 or 5 weeks), skipping dates before `from`. */
  function autoSessions(state, slots, month, from) {
    const closed = new Set(state.settings.closedDates || []);
    const dates = monthDates(month), out = [];
    for (const sl of slots) {
      const g = groupById(state, sl.groupId);
      if (!g || !g.active || !g.days.includes(sl.dow)) continue;
      for (const d of dates) {
        if (d.dow !== sl.dow || closed.has(d.key) || (from && d.key < from) || classOff(state, g.id, d.key)) continue;
        out.push({ groupId: g.id, date: d.key });
      }
    }
    return normalizeSessions(out);
  }
  /** v0.24: the next `count` regular sessions of the chosen slots from `from` (crosses into the next month). */
  function packSessions(state, slots, from, count) {
    const closed = new Set(state.settings.closedDates || []), out = [];
    const ok = slots.filter(sl => { const g = groupById(state, sl.groupId); return g && g.active && g.days.includes(sl.dow); });
    if (!ok.length || !from) return [];
    const [y, m, d] = from.split('-').map(Number);
    for (let i = 0; i < 75 && out.length < count; i++) {
      const dt = new Date(Date.UTC(y, m - 1, d + i)), key = `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`;
      if (closed.has(key)) continue;
      ok.filter(sl => sl.dow === dt.getUTCDay() && !classOff(state, sl.groupId, key)).forEach(sl => { if (out.length < count) out.push({ groupId: sl.groupId, date: key }); });
    }
    return normalizeSessions(out);
  }
  /** v0.37 count-based pack that starts mid-week: the pattern days already gone that week are replaced by
   *  later days of the same group in the same week (stand-in days, flagged makeup+sub), then the regular days fill up to `count`.
   *  e.g. Mon+Tue, start Wed 11 → Wed 11, Thu 12 (stand-ins) + Mon 16, Tue 17, … = 8. */
  function smartPackSessions(state, slots, from, count) {
    const base = packSessions(state, slots, from, count);
    if (!from || !base.length) return base;
    const dw = dowOf(from), wkStart = addDays(from, -((dw + 6) % 7)), wkEnd = addDays(wkStart, 6);
    const pat = slots.filter(sl => { const g = groupById(state, sl.groupId); return g && g.active && g.days.includes(sl.dow); });
    const patDows = new Set(pat.map(sl => sl.dow));
    const missed = [];
    for (let k = wkStart; k < from; k = addDays(k, 1)) pat.filter(sl => sl.dow === dowOf(k) && sl.dow !== 0 && !classOff(state, sl.groupId, k)).forEach(sl => missed.push(sl));
    if (!missed.length) return base;
    const subs = [], used = new Set(base.map(x => x.groupId + '|' + x.date));
    missed.forEach(sl => {
      const g = groupById(state, sl.groupId);
      for (let k = from; k <= wkEnd; k = addDays(k, 1)) {
        const d = dowOf(k), key = g.id + '|' + k;
        if (d === 0 || patDows.has(d) || !g.days.includes(d) || used.has(key) || classOff(state, g.id, k)) continue;
        if (seatInfo(state, g.id, k, {}).free <= 0) continue;
        subs.push({ groupId: g.id, date: k, makeup: true, sub: true }); used.add(key); break;
      }
    });
    if (!subs.length) return base;
    return normalizeSessions(subs.concat(base.slice(0, Math.max(0, count - subs.length)))).map(x => subs.some(y => y.groupId === x.groupId && y.date === x.date) ? { ...x, sub: true } : x);
  }
  /** v0.27 "monthly from any day": 18/11 → 17/12; 31/1 → 28/2 (if the day does not exist next month, the span ends on that month's last day). */
  function spanEnd(from) {
    const [y, m, d] = String(from).split('-').map(Number);
    const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    const end = d > last ? new Date(Date.UTC(y, m, last)) : new Date(Date.UTC(y, m, d - 1));
    return `${end.getUTCFullYear()}-${pad(end.getUTCMonth() + 1)}-${pad(end.getUTCDate())}`;
  }
  /** Every open date of the chosen weekly slots inside one month-long span. */
  function spanSessions(state, slots, from) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(from || ''))) return [];
    const closed = new Set(state.settings.closedDates || []), to = spanEnd(from), out = [];
    const ok = slots.filter(sl => { const g = groupById(state, sl.groupId); return g && g.active && g.days.includes(sl.dow); });
    for (let k = from; k <= to; k = addDays(k, 1)) { if (closed.has(k)) continue; const dw = dowOf(k); ok.filter(sl => sl.dow === dw && !classOff(state, sl.groupId, k)).forEach(sl => out.push({ groupId: sl.groupId, date: k })); }
    return normalizeSessions(out);
  }
  function openDatesInRange(state, from, to, dow, gids) {
    const closed = new Set(state.settings.closedDates || []); let n = 0;
    for (let k = from; k <= to; k = addDays(k, 1)) if (dowOf(k) === dow && !closed.has(k) && !(gids && gids.length && gids.every(g => classOff(state, g, k)))) n++;
    return n;
  }
  /** Price options for a stored request (kind-aware). */
  function priceOpts(e) { return { pack: e.kind === 'pack', span: e.kind === 'span' ? { from: e.spanFrom, to: e.spanTo } : null }; }
  /** First and last class date + the paid-for period of a request. */
  function period(e) {
    const ss = (e.sessions || []).map(x => x.date).sort();
    const first = ss[0] || null, last = ss[ss.length - 1] || null;
    if (e.kind === 'span') return { from: e.spanFrom, to: e.spanTo, first, last };
    if (e.kind === 'pack') return { from: first, to: last, first, last };
    const m = e.month; return { from: m + '-01', to: m + '-' + pad(new Date(Date.UTC(+m.slice(0, 4), +m.slice(5, 7), 0)).getUTCDate()), first, last };
  }
  /** Open (not closed) dates of a weekday in a month. */
  function openDatesOfDow(state, month, dow, gids) {
    const closed = new Set(state.settings.closedDates || []);
    return monthDates(month).filter(d => d.dow === dow && !closed.has(d.key) && !(gids && gids.length && gids.every(g => classOff(state, g, d.key)))).length;
  }
  /** Keep each session's original booking date; sessions added now are booked today. */
  function stampSessions(oldSessions, newSessions, today) {
    const old = {}; (oldSessions || []).forEach(s => { old[s.groupId + '|' + s.date] = s.bookedOn; });
    return normalizeSessions(newSessions).map(s => ({ ...s, bookedOn: old[s.groupId + '|' + s.date] || s.bookedOn || today }));
  }

  /** Other active groups that regularly meet on `date` in the same room or with the same teacher at an overlapping time. */
  function makeupConflicts(state, g, date) {
    const d = dowOf(date);
    return state.groups.filter(o => o.id !== g.id && o.active && o.days.includes(d) && overlaps(o, g) &&
      (o.roomId === g.roomId || (g.teacherId && o.teacherId === g.teacherId))).map(o => o.code);
  }
  /** Groups that hold a class on `date`: their regular weekday, or a make-up session booked on that date. */
  function groupsOnDate(state, date) {
    if ((state.settings.closedDates || []).includes(date)) return [];
    const d = dowOf(date);
    const mk = new Set(state.enrollments.filter(e => ACTIVE_SEAT.includes(e.status)).flatMap(e => e.sessions)
      .filter(s => s.date === date && s.makeup).map(s => s.groupId));
    return state.groups.filter(g => g.active && (g.days.includes(d) || mk.has(g.id)) && !classOff(state, g.id, date));
  }
  /** v0.29 classes cancelled on a date (for notices on the attendance page and calendar). */
  function cancelledOn(state, date) { return (state.cancelledClasses || []).filter(c => c.date === date); }

  /** Same student, same date, overlapping time in different groups. */
  function findClashes(state, sessions, otherSessions) {
    const all = normalizeSessions(sessions).map(s => ({ ...s, own: true }))
      .concat(normalizeSessions(otherSessions || []).map(s => ({ ...s, own: false })));
    const byDate = {};
    all.forEach(s => (byDate[s.date] = byDate[s.date] || []).push(s));
    const clashes = [];
    Object.entries(byDate).forEach(([date, list]) => {
      for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        if (!a.own && !b.own) continue;
        if (a.groupId === b.groupId) { if (a.own !== b.own) clashes.push({ date, groups: [a.groupId], duplicate: true }); continue; }
        const ga = groupById(state, a.groupId), gb = groupById(state, b.groupId);
        if (ga && gb && overlaps(ga, gb)) clashes.push({ date, groups: [a.groupId, b.groupId] });
      }
    });
    return clashes;
  }

  /* ---------- pricing ---------- */
  /** v0.35 the weekly pattern behind a set of dates. A child who studies Mon+Tue but sat Wed+Thu in the first week
   *  has 4 different weekdays but only 2 classes a week: the 2 most-used weekdays are the pattern, the others are stand-in (substitute) days. */
  function weeklyPattern(sessions) {
    const reg = normalizeSessions(sessions).filter(x => !x.makeup && dowOf(x.date) !== 0);
    const perWeek = {}, perDow = {};
    reg.forEach(x => { const d = dowOf(x.date), wk = addDays(x.date, -((d + 6) % 7)); perWeek[wk] = (perWeek[wk] || 0) + 1; perDow[d] = (perDow[d] || 0) + 1; });
    const distinct = Object.keys(perDow).length, counts = Object.values(perWeek);

    audit(state, 'studentImport', { added: added.length, skipped: skipped.length }, today); // counts only, no names
    return { added, skipped };
  }

  /* ---------- permanent student deletion ---------- */
  /** What would be removed with this student (shown to staff before they confirm). */
  function studentFootprint(state, id) {
    const es = state.enrollments.filter(e => e.studentId === id), eids = new Set(es.map(e => e.id));
    return {
      enrollments: es.length,
      payments: state.payments.filter(p => p.studentId === id || eids.has(p.enrollmentId)).length,
      paidTotal: state.payments.filter(p => !p.voided && p.method !== 'wallet' && (p.studentId === id || eids.has(p.enrollmentId))).reduce((a, p) => a + Number(p.amount), 0),
      attendance: state.attendance.filter(a => a.studentId === id).length,

  }
  /** Removes the student and every record that belongs to them; freed seats go to the waiting list. Audit keeps counts only. */
  function deleteStudent(state, id, today) {
    if (!state.students.some(s => s.id === id)) return { ok: false, errors: ['noStudent'] };
    // v0.26: money history is never deleted — use the "left" status instead
    if (state.payments.some(p => p.studentId === id) || (state.refunds || []).some(r => r.studentId === id)) return { ok: false, errors: ['hasPayments'] };
    const removed = studentFootprint(state, id);
    const eids = new Set(state.enrollments.filter(e => e.studentId === id).map(e => e.id));
    state.students = state.students.filter(s => s.id !== id);
    state.enrollments = state.enrollments.filter(e => e.studentId !== id);
    state.payments = state.payments.filter(p => !(p.studentId === id || eids.has(p.enrollmentId)));
    state.attendance = state.attendance.filter(a => a.studentId !== id);
    state.assessments = state.assessments.filter(a => a.studentId !== id);
    state.credits = (state.credits || []).filter(c => c.studentId !== id);
    state.makeups = (state.makeups || []).filter(m => m.studentId !== id);
    if (state.reportNotes) Object.keys(state.reportNotes).filter(k => k.startsWith(id + '|')).forEach(k => delete state.reportNotes[k]);
    (state.leads || []).forEach(l => { if (l.studentId === id) delete l.studentId; });
    state.stars = (state.stars || []).filter(x => x.studentId !== id);
    audit(state, 'studentDelete', { enrollments: removed.enrollments, payments: removed.payments, attendance: removed.attendance, assessments: removed.assessments }, today);
    const promoted = promoteWaitlist(state, today);
    return { ok: true, removed, promoted };
  }

  /* ---------- student status & profile (v0.12) ---------- */
  const STUDENT_STATUS = ['active', 'paused', 'left'];
  /** 'active' (studying) | 'paused' (on a break) | 'left' (stopped). Old records only had active true/false. */
  function studentStatus(s) {
    if (!s) return 'active';
    if (STUDENT_STATUS.includes(s.status)) return s.status;
    return s.active === false ? 'paused' : 'active';
  }
  /** Change status with a dated history line. Leaving cancels open requests (pending / offered / waiting); approved months stay. */
  function setStudentStatus(state, id, status, opts, today) {
    const s = state.students.find(x => x.id === id);
    if (!s) return { ok: false, errors: ['noStudent'] };
    if (!STUDENT_STATUS.includes(status)) return { ok: false, errors: ['badStatus'] };
    opts = opts || {};
    const from = studentStatus(s);
    if (from === status) return { ok: false, errors: ['sameStatus'] };
    const date = /^\d{4}-\d{2}-\d{2}$/.test(String(opts.date || '')) ? opts.date : today;
    const reason = String(opts.reason || '').trim().slice(0, 200);
    s.status = status; s.active = status === 'active'; s.statusDate = date; s.statusReason = status === 'active' ? '' : reason;
    (s.statusHistory = Array.isArray(s.statusHistory) ? s.statusHistory : []).push({ from, to: status, date, reason });
    const cancelled = [];
    let makeupsCancelled = 0, creditsVoided = 0;
    if (status === 'left') {
      state.enrollments.filter(e => e.studentId === id && ['pending', 'offered', 'waitlisted'].includes(e.status)).forEach(e => {
        e.status = 'cancelled'; e.reason = 'studentLeft'; e.cancelledAt = new Date().toISOString(); cancelled.push(e.id);
      });
      (state.makeups || []).filter(m => m.studentId === id && m.status === 'booked' && m.date >= today).forEach(m => { m.status = 'cancelled'; makeupsCancelled++; });
      (state.credits || []).filter(c => c.studentId === id && c.status === 'open').forEach(c => { c.status = 'void'; creditsVoided++; });
    }
    // Seats may have opened (cancelled requests, released renewal hold) → FIFO waiting list.
    const promoted = promoteWaitlist(state, today);
    const keptApproved = state.enrollments.filter(e => e.studentId === id && e.status === 'approved' && e.month >= String(today).slice(0, 7)).map(e => e.id);
    audit(state, 'studentStatus', { id, from, to: status, cancelled: cancelled.length }, today); // no reason text in the log
    return { ok: true, from, cancelled, promoted, keptApproved, makeupsCancelled, creditsVoided, wallet: walletBalance(state, id) };
  }
  const PHONE_RE = /^[0-9+]{9,15}$/;
  const cleanPhone = v => String(v || '').replace(/[\s\-().]/g, '');
  /** Trims profile fields and returns error keys (only the name is required). */
  function cleanStudentProfile(f, today) {
    const errors = [];
    ['name', 'nickname', 'parentName', 'parent2Name', 'parent2Rel', 'lineId', 'emergencyName', 'schoolName', 'note'].forEach(k => { f[k] = String(f[k] || '').trim().slice(0, k === 'note' ? 300 : 100); });
    ['parentPhone', 'parent2Phone', 'emergencyPhone'].forEach(k => {
      f[k] = cleanPhone(f[k]);
      if (f[k] && !PHONE_RE.test(f[k])) errors.push(k === 'parentPhone' ? 'phoneBad' : k === 'parent2Phone' ? 'phone2Bad' : 'phoneEmBad');
    });
    f.birthDate = String(f.birthDate || '').trim();
    if (f.birthDate && (!/^\d{4}-\d{2}-\d{2}$/.test(f.birthDate) || (today && f.birthDate > today))) errors.push('birthBad');
    if (!f.name) errors.push('nameRequired');
    return errors;
  }
  /** Month-by-month money history for one student: billed (approved only), paid, balance, plus totals. */
  function studentHistory(state, id) {
    const es = state.enrollments.filter(e => e.studentId === id).sort((a, b) => b.month.localeCompare(a.month) || String(b.createdAt).localeCompare(String(a.createdAt)));
    const rows = es.map(e => ({ e, due: amountDue(e), paid: paidFor(state, e.id), bal: e.status === 'approved' ? balance(state, e) : 0 }));
    const pays = state.payments.filter(p => p.studentId === id || es.some(e => e.id === p.enrollmentId)).sort((a, b) => String(b.date).localeCompare(String(a.date)));
    const tot = rows.reduce((a, r) => ({ due: a.due + r.due, paid: a.paid + r.paid, bal: a.bal + r.bal }), { due: 0, paid: 0, bal: 0 });
    return { rows, pays, tot, months: new Set(rows.filter(r => r.e.status === 'approved').map(r => r.e.month)).size };
  }

  /* ---------- v0.25 waiting-list automation ---------- */
  const addDays = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; };
  /** When an offer runs out. */
  function offerDeadline(state, e) { return e.offeredAt ? new Date(new Date(e.offeredAt).getTime() + (Number(state.settings.offerHours) || 48) * 3600e3).toISOString() : null; }
  /** Offers nobody confirmed in time go back to the end of the queue (the seat passes to the next child). */
  function expireOffers(state, nowIso, today) {
    const out = [];
    state.enrollments.filter(e => e.status === 'offered' && e.offeredAt).forEach(e => {
      if (offerDeadline(state, e) <= nowIso) {
        e.status = 'waitlisted'; e.waitlistedAt = backOfQueue(state, nowIso); e.offerMissed = (e.offerMissed || 0) + 1; e.offeredAt = null;
        audit(state, 'offerExpired', { id: e.id }, today); out.push(e.id);
      }
    });
    return out;
  }
  /** Staff choice: pass this offer to the next child (this one goes to the back of the queue). */
  function skipOffer(state, id, today) {
    const e = state.enrollments.find(x => x.id === id);
    if (!e || e.status !== 'offered') return { ok: false, errors: ['badStatus'] };
    e.status = 'waitlisted'; e.waitlistedAt = backOfQueue(state); e.offeredAt = null; e.offerMissed = (e.offerMissed || 0) + 1;
    audit(state, 'offerSkip', { id }, today);
    return { ok: true, promoted: promoteWaitlist(state, today).filter(x => x !== id) };
  }
  /** Position of a waiting request among those that need the same group (1 = next). */
  function queuePosition(state, e) {
    const gids = new Set(e.sessions.map(s => s.groupId));
    const q = waitlistQueue(state).filter(x => x.sessions.some(s => gids.has(s.groupId)));
    return q.findIndex(x => x.id === e.id) + 1;
  }
  /** Same-level groups that still have room for every date of the requested weekday (alternatives when a class is full). */
  function alternatives(state, level, month, excludeGroupIds, studentId, today) {
    const out = [];
    state.groups.filter(g => g.active && g.level === level && !excludeGroupIds.includes(g.id)).forEach(g => g.days.forEach(dow => {
      const ds = monthDates(month).filter(d => d.dow === dow && !(state.settings.closedDates || []).includes(d.key) && (!today || d.key >= today));
      if (!ds.length) return;
      const free = Math.min(...ds.map(d => seatInfo(state, g.id, d.key, { studentId, today }).free));
      if (free > 0) out.push({ groupId: g.id, dow, free });
    }));
    return out;
  }

  /* ---------- v0.25 make-up credits ---------- */
  /** Called whenever attendance is set: "ลา" (and "ขาด" if allowed) creates one credit; changing the mark back removes an unused credit. */
  function syncCredit(state, rec, today) {
    state.credits = state.credits || [];
    const st = state.settings, gives = (rec.status === 'leave' && st.creditOnLeave !== false) || (rec.status === 'absent' && st.creditOnAbsent);
    const ex = state.credits.find(c => c.attKey === rec.key && c.status !== 'void');
    const stu = state.students.find(x => x.id === rec.studentId);
    if (gives && !ex && !(stu && studentStatus(stu) === 'left')) {
      const c = { id: uid('C'), attKey: rec.key, studentId: rec.studentId, groupId: rec.groupId, fromDate: rec.date, reason: rec.status,
        issuedOn: today, expiresOn: addDays(rec.date, Number(st.creditDays) || 30), status: 'open' };
      state.credits.push(c); audit(state, 'creditIssue', { id: c.id, studentId: c.studentId }, today); return c;
    }
    if (!gives && ex && ex.status === 'open') { ex.status = 'void'; audit(state, 'creditVoid', { id: ex.id }, today); }
    return null;
  }
  function expireCredits(state, today) {
    const out = [];
    (state.credits || []).forEach(c => { if (c.status === 'open' && c.expiresOn < today) { c.status = 'expired'; out.push(c.id); } });
    return out;
  }
  function openCredits(state, studentId, today) { return (state.credits || []).filter(c => c.status === 'open' && c.studentId === studentId && (!today || c.expiresOn >= today)); }
  /** Book a make-up class with a credit: same level, any group, a date that has a free seat and is not a clash. */
  function bookMakeup(state, creditId, groupId, date, today) {
    const c = (state.credits || []).find(x => x.id === creditId), g = groupById(state, groupId), st = state.students.find(x => x.id === (c || {}).studentId);
    const errors = [];
    if (!c || c.status !== 'open') errors.push('creditUsed');
    else if (date > c.expiresOn) errors.push('creditExpired');
    if (!g || !g.active) errors.push('groupInactive');
    else if (!g.days.includes(dowOf(date))) errors.push('wrongDay');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date || '')) || date < today) errors.push('pastDate');
    if ((state.settings.closedDates || []).includes(date)) errors.push('closedDate');
    else if (g && classOff(state, g.id, date)) errors.push('classCancelled');
    if (st && studentStatus(st) === 'left') errors.push('studentNotActive');
    if (st && g && st.level !== g.level) errors.push('levelMismatch');
    if (errors.length) return { ok: false, errors };
    if (studentInClass(state, c.studentId, groupId, date)) return { ok: false, errors: ['studentClash'] };
    const clash = findClashes(state, [{ groupId, date }], otherStudentSessions(state, c.studentId, null).concat((state.makeups || []).filter(m => m.studentId === c.studentId && m.status === 'booked')));
    if (clash.length) return { ok: false, errors: ['studentClash'] };
    if (seatInfo(state, groupId, date, { studentId: c.studentId, today }).free <= 0) return { ok: false, errors: ['full'] };
    const m = { id: uid('MK'), creditId, studentId: c.studentId, groupId, date, status: 'booked', bookedOn: today };
    (state.makeups = state.makeups || []).push(m); c.status = 'used'; c.usedFor = m.id;
    audit(state, 'makeupBook', { id: m.id, creditId }, today);
    return { ok: true, makeup: m };
  }
  /** Cancel a make-up booking: the credit comes back (if not expired). */
  function cancelMakeup(state, id, today) {
    const m = (state.makeups || []).find(x => x.id === id);
    if (!m || m.status !== 'booked') return { ok: false, errors: ['badStatus'] };
    m.status = 'cancelled';
    const c = (state.credits || []).find(x => x.id === m.creditId); if (c) { c.status = c.expiresOn >= today ? 'open' : 'expired'; c.usedFor = null; }
    audit(state, 'makeupCancel', { id }, today);
    return { ok: true, promoted: promoteWaitlist(state, today) };
  }

  /* ---------- v0.25 monthly renewal run ---------- */
  /** Students approved this month and their weekly slots — who still needs next month's request. */
  function renewalList(state, month) {
    const next = shiftMonth(month, 1), rows = [];
    const byStudent = {};
    // count-based packs that end this month or next: renew as a new pack right after the last class
    const packIds = new Set();
    state.enrollments.filter(e => e.status === 'approved' && (e.kind === 'pack' || e.kind === 'span') && e.sessions.length).forEach(e => {
      const last = e.kind === 'span' ? e.spanTo : e.sessions[e.sessions.length - 1].date;
      if (last.slice(0, 7) !== month && last.slice(0, 7) !== next) return;
      const st = state.students.find(x => x.id === e.studentId); if (!st || studentStatus(st) !== 'active') return;
      const newer = state.enrollments.find(x => x.studentId === e.studentId && x.id !== e.id && OPEN.includes(x.status) && x.sessions.some(s => s.date > last));
      const slots = slotsOf(e.sessions);
      rows.push({ studentId: e.studentId, slots, renewed: !!newer, nextReq: newer ? newer.id : null, pack: { from: addDays(last, 1), count: e.sessions.filter(s => !s.makeup).length, last, span: e.kind === 'span' } });
      packIds.add(e.studentId);
    });
    state.enrollments.filter(e => e.status === 'approved' && e.kind !== 'pack' && e.kind !== 'span' && !packIds.has(e.studentId) && e.sessions.some(s => s.date.slice(0, 7) === month)).forEach(e => {
      const st = state.students.find(x => x.id === e.studentId); if (!st || studentStatus(st) !== 'active') return;
      const b = byStudent[e.studentId] = byStudent[e.studentId] || { studentId: e.studentId, slots: [] };
      slotsOf(e.sessions.filter(s => s.date.slice(0, 7) === month)).forEach(sl => { if (!b.slots.some(x => x.groupId === sl.groupId && x.dow === sl.dow)) b.slots.push(sl); });
    });
    Object.values(byStudent).forEach(b => {
      const nextReq = state.enrollments.find(e => e.studentId === b.studentId && OPEN.includes(e.status) && e.sessions.some(s => s.date.slice(0, 7) === next));
      rows.push({ ...b, renewed: !!nextReq, nextReq: nextReq ? nextReq.id : null });
    });
    return rows;
  }
  /** Create next month's requests (same days) for everyone not yet renewed. Full classes go to the waiting list. */
  function runRenewals(state, month, today, onlyIds) {
    const next = shiftMonth(month, 1), res = { created: [], waitlisted: [], failed: [] };
    renewalList(state, month).filter(r => !r.renewed && (!onlyIds || onlyIds.includes(r.studentId))).forEach(r => {
      if (r.pack) {
        const ps = r.pack.span ? spanSessions(state, r.slots, r.pack.from) : packSessions(state, r.slots, r.pack.from, r.pack.count);
        if (!ps.length) { res.failed.push({ studentId: r.studentId, errors: ['noSessions'] }); return; }
        const c = createEnrollment(state, r.pack.span ? { studentId: r.studentId, month: r.pack.from.slice(0, 7), kind: 'span', spanFrom: r.pack.from, sessions: ps, note: 'ต่อรายเดือน (นับจากวันเริ่ม) อัตโนมัติ' }
          : { studentId: r.studentId, month: ps[0].date.slice(0, 7), kind: 'pack', sessions: ps, note: 'ต่อชุดนับครั้งอัตโนมัติ' }, today, { waitlist: true });
        if (!c.ok) res.failed.push({ studentId: r.studentId, errors: c.errors }); else if (c.enrollment.status === 'waitlisted') res.waitlisted.push(c.enrollment.id); else res.created.push(c.enrollment.id);
        return;
      }
      const sessions = autoSessions(state, r.slots, next);
      if (!sessions.length) { res.failed.push({ studentId: r.studentId, errors: ['noSessions'] }); return; }
      const c = createEnrollment(state, { studentId: r.studentId, month: next, sessions, note: 'ต่อเดือนอัตโนมัติ' }, today, { waitlist: true });
      if (!c.ok) res.failed.push({ studentId: r.studentId, errors: c.errors });
      else if (c.enrollment.status === 'waitlisted') res.waitlisted.push(c.enrollment.id);
      else res.created.push(c.enrollment.id);
    });
    audit(state, 'renewalRun', { month: next, created: res.created.length, waitlisted: res.waitlisted.length, failed: res.failed.length }, today);
    return res;
  }

  /** v0.26: school cancels a class date (teacher sick, holiday added later). groupId null = every class that day.
   *  Each booked child gets a make-up credit (reason 'school'), the date leaves the request (price unchanged), make-ups on that date are cancelled with their credit returned. */
  function cancelClassDate(state, groupId, date, reason, today) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date || ''))) return { ok: false, errors: ['pastDate'] };
    const gids = groupId ? [groupId] : state.groups.filter(g => g.days.includes(dowOf(date))).map(g => g.id);
    const res = { credits: 0, makeups: 0, requests: 0 };
    state.credits = state.credits || [];
    state.enrollments.filter(e => ['approved', 'pending', 'offered', 'waitlisted'].includes(e.status)).forEach(e => {
      const hit = e.sessions.filter(x => gids.includes(x.groupId) && x.date === date);
      if (!hit.length) return;
      e.sessions = e.sessions.filter(x => !(gids.includes(x.groupId) && x.date === date));
      (e.cancelledSessions = e.cancelledSessions || []).push(...hit.map(x => ({ ...x, reason: String(reason || '').slice(0, 100), on: today })));
      res.requests++;

      if (e.status === 'approved' && !(stu && studentStatus(stu) === 'left')) hit.forEach(x => {
        state.credits.push({ id: uid('C'), attKey: 'school|' + e.studentId + '|' + x.groupId + '|' + date, studentId: e.studentId, groupId: x.groupId, fromDate: date, reason: 'school',

    });

    (state.leads || []).filter(l => l.status === 'trial' && gids.includes(l.trialGroupId) && l.trialDate === date).forEach(l => {
      l.status = 'contacted'; l.trialCancelled = date; (l.log = l.log || []).push({ date: today, step: 'contacted', note: 'trial class cancelled ' + date }); res.trials++; });
    (state.cancelledClasses = state.cancelledClasses || []).push({ groupId: groupId || null, date, reason: String(reason || '').slice(0, 100), on: today });
    audit(state, 'classCancel', { groupId: groupId || 'all', date, ...res }, today);
    return { ok: true, ...res };
  }
  /** v0.26: after the owner changes prices, re-quote requests that are not approved yet. */
  function repriceOpen(state, today) {
    let n = 0;
    state.enrollments.filter(e => ['pending', 'offered', 'waitlisted'].includes(e.status)).forEach(e => {
      const p = price(state, e.sessions, e.requestDate || today, priceOpts(e));
      if (p.total !== e.quote || p.needsReview !== e.needsReview) { e.quote = p.total; e.needsReview = p.needsReview; n++; }

  /** v0.26: records older than `months` that are not money (attendance, closed requests, used credits) — to archive and remove. */
  function archiveCandidates(state, today, months) {
    const cut = shiftMonth(String(today).slice(0, 7), -(months || 12)) + '-01';
    return {
      attendance: state.attendance.filter(a => a.date < cut),
      enrollments: state.enrollments.filter(e => ['cancelled', 'rejected'].includes(e.status) && (e.sessions[e.sessions.length - 1] || { date: e.month + '-01' }).date < cut && !state.payments.some(p => p.enrollmentId === e.id)),
      credits: (state.credits || []).filter(c => c.status !== 'open' && c.fromDate < cut),

  }
  function archiveOld(state, today, months) {
    const c = archiveCandidates(state, today, months);
    const ids = k => new Set(c[k].map(x => x.id || x.key));
    const ia = ids('attendance'), ie = ids('enrollments'), ic = ids('credits'), im = ids('makeups');
    state.attendance = state.attendance.filter(a => !ia.has(a.key));
    state.enrollments = state.enrollments.filter(e => !ie.has(e.id));
    state.credits = (state.credits || []).filter(x => !ic.has(x.id));
    state.makeups = (state.makeups || []).filter(x => !im.has(x.id));
    // keep a summary so reports still know the totals
    (state.archives = state.archives || []).push({ on: today, before: c.cut, attendance: c.attendance.length, enrollments: c.enrollments.length });
    audit(state, 'archive', { before: c.cut, attendance: c.attendance.length, enrollments: c.enrollments.length }, today);
    return { archived: { attendance: c.attendance, enrollments: c.enrollments, credits: c.credits, makeups: c.makeups, before: c.cut } };
  }
  /** Runs on every open/refresh: expire stale offers and credits, then fill free seats from the queue. */
  function housekeeping(state, today, nowIso) {
    const expiredOffers = expireOffers(state, nowIso || new Date().toISOString(), today);
    const expiredCredits = expireCredits(state, today);
    const promoted = promoteWaitlist(state, today);

    let imp = '';
    if (u.imp) {

      const have = new Set(S.students.map(x => String(x.name).trim().toLowerCase().replace(/\s+/g, ' ')));
      const slotTxt = r => r.slots.map(x => G(x.groupId).code + ' ' + dn(x.dow)).join(', ');
      const wtxt = r => r.warn.map(w => t('w_' + w.split(':')[0])).concat(have.has(r.name.trim().toLowerCase().replace(/\s+/g, ' ')) ? [t('w_dup')] : []);
      imp = `<div class="card"><h3>${t('i_title')}</h3><div class="alert warn">${t('i_privacy')}</div><p class="note">${t('i_help2')}</p>
        <textarea data-bind="students.imp.text" rows="8" style="width:100%;font:inherit" placeholder="${esc(t('i_ex'))}">${esc(u.imp.text)}</textarea>
        <div class="fields two">${fld(t('i_defLevel'), sel('students.imp.level', levels()))}<div class="field"><label>&nbsp;</label><button class="btn primary" data-act="impPreview">${t('i_preview')}</button></div></div>
        ${u.imp.shown ? `<p><b>${t('i_ready', { n: pr.rows.length })}</b>${pr.errors.length ? ` · <span class="muted">${pr.errors.length} ${t('err_nameRequired')}</span>` : ''}</p>
        <div class="overflow"><table><thead><tr><th>#</th><th>${t('name')}</th><th>${t('s_nick')}</th><th>${t('level')}</th><th>${t('s_parent')}</th><th>${t('s_phone')}</th><th>${t('i_course')}</th><th>${t('i_warn')}</th></tr></thead><tbody>
        ${pr.rows.map((r, i) => { const w = wtxt(r); return `<tr><td>${i + 1}</td><td><b>${esc(r.name)}</b>${r.note ? `<br><span class="tiny muted">${esc(r.note)}</span>` : ''}</td><td>${esc(r.nickname)}</td><td>${lv(r.level)}</td><td>${esc(r.parentName)}</td><td>${esc(r.parentPhone)}${r.parent2Phone ? '<br>' + esc(r.parent2Phone) : ''}</td>
          <td>${esc(slotTxt(r)) || (r.courseText ? `<span class="muted">${esc(r.courseText)}</span>` : '—')}</td><td>${w.length ? `<span class="tiny" style="color:#a1303c">${esc(w.join(' · '))}</span>` : '✓'}</td></tr>`; }).join('')}</tbody></table></div>
        <p class="note">${t('i_fix')}</p>
        <label class="check"><input type="checkbox" data-act="impToggleReq" ${u.imp.mkReq ? 'checked' : ''}> ${t('i_mkReq')}</label>
        ${u.imp.mkReq ? `<div class="fields two">${fld(t('i_reqMonth'), `<input type="month" data-bind="students.imp.month" value="${esc(u.imp.month)}">`)}</div>` : ''}` : ''}
        ${u.imp.result ? `<div class="alert ok">${esc(t('i_done', u.imp.result))}${u.imp.result.req ? '<br>' + esc(t('i_reqDone', u.imp.result.req)) : ''}</div>` : ''}
        <div class="flex"><button class="btn primary" data-act="impDo" ${pr.rows.length && u.imp.shown ? '' : 'disabled'}>${t('i_do', { n: pr.rows.length })}</button><button class="btn" data-act="impClose">${t('close')}</button></div></div>`;
    }
    return stc + (u.eb ? endBoardCard() : '') + pcc + dupc + imp + form + detail + `<div class="card"><div class="spaced"><h3>${t('s_title')} (${list.length})</h3><div class="flex">
      <button class="btn sm" data-act="dupOpen">👥 ${t('du_btn')}</button><button class="btn sm" data-act="pcOpen">🔍 ${t('pc_btn')}</button><button class="btn sm" data-act="ebOpen">🗓 ${t('eb_btn')}</button>
      <select data-bind="students.fStatus" data-live><option value="">${t('ss_all')} (${base.length})</option>${E.STUDENT_STATUS.map(k => `<option value="${k}" ${u.fStatus === k ? 'selected' : ''}>${t('ss_' + k)} (${cnt(k)})</option>`).join('')}</select>
      ${S.students.some(E.isDemoStudent) ? `<label class="check tiny"><input type="checkbox" data-act="toggleHideDemo" ${u.hideDemo ? 'checked' : ''}> ${t('i_hideDemo')}</label>` : ''}
      <button class="btn" data-act="impOpen">${t('i_open')}</button>
      <input data-bind="students.q" data-live-change placeholder="${t('search')}" value="${esc(u.q)}" style="width:200px">
      <button class="btn primary" data-act="newStudent">${t('s_new')}</button></div></div>
      <div class="overflow"><table><thead><tr><th>${t('code')}</th><th>${t('name')}</th><th>${t('level')}</th><th>${t('s_parent')}</th><th>${t('status')}</th><th>${t('actions')}</th></tr></thead><tbody>
      ${list.map(s => `<tr class="${s.active ? '' : 'dim'}"><td>${esc(s.code)}</td><td><b>${esc(s.name)}</b><br><span class="tiny muted">${esc(s.nickname)}</span></td><td>${lv(s.level)}</td>
        <td>${esc(s.parentName)}<br><span class="tiny muted">${esc(s.parentPhone)}</span></td><td>${ssBadge(s)}${SS(s) !== 'active' && s.statusDate ? `<br><span class="tiny muted">${t('ss_since')} ${esc(dd(s.statusDate))}</span>` : ''}</td>
        <td class="acts"><button class="btn sm" data-act="viewStudent" data-id="${s.id}">${t('view')}</button><button class="btn sm" data-act="editStudent" data-id="${s.id}">${t('edit')}</button>

  function delStudentRow(s) {
    const f = E.studentFootprint(S, s.id);
    const has = f.enrollments || f.payments || f.attendance || f.assessments;
    return `<tr class="del-row"><td colspan="6"><div class="alert err"><b>${esc(t('s_delQ', { n: s.name }))}</b><br>
      ${has ? esc(t('s_delAlso', { e: f.enrollments, p: f.payments, m: money(f.paidTotal), a: f.attendance, s: f.assessments })) : esc(t('s_delNone'))}<br>${t('s_delNoUndo')}</div>
      <div class="flex"><button class="btn danger" data-act="doDelStudent" data-id="${s.id}">${t('s_delYes')}</button><button class="btn" data-act="cancelDelStudent">${t('cancel')}</button></div></td></tr>`;
  }

  /* ---- Smart Enrollment ---- */
  function enrollLevel() { const u = ui.enroll; const s = S.students.find(x => x.id === u.studentId); return s ? s.level : u.level; }
  function enrollGroups() { const l = enrollLevel(); return S.groups.filter(g => g.active && g.level === l); }
  pages.enroll = () => {
    const u = ui.enroll;
    const tabs = `<div class="tabs">${['new', 'req', 'wait', 'renew'].map(k => `<button class="tab ${u.tab === k ? 'on' : ''}" data-act="enrollTab" data-tab="${k}">${t('e_tab_' + k)}${k === 'wait' ? ` (${E.waitlistQueue(S).length})` : k === 'req' ? ` (${S.enrollments.filter(e => ['pending', 'offered'].includes(e.status)).length})` : ''}</button>`).join('')}</div>`;
    if (u.tab === 'req') return tabs + enrollRequests();
    if (u.tab === 'wait') return tabs + enrollWaitlist();
    if (u.tab === 'renew') return tabs + renewPanel();
    return tabs + enrollForm();
  };
  /** v0.13: one weekly grid (days × classes of the student's level) instead of "pick group, then pick day". */
  function weekPicker() {
    const u = ui.enroll, td = today(), lvl = enrollLevel();
    if (!u.studentId && !lvl) return `<div class="card"><h3>${t('wk_title')}</h3><p class="muted">${t('wk_pickLevel')}</p></div>`;
    const groups = enrollGroups();
    if (!groups.length) return `<div class="card"><h3>${t('wk_title')}</h3><p class="muted">${t('wk_noneLevel', { l: lv(lvl) })}</p><button class="btn sm" data-act="go" data-page="classes">${t('nav_classes')}</button></div>`;
    const order = [1, 2, 3, 4, 5, 6, 0].filter(d => groups.some(g => g.days.includes(d)));
    const isOn = (g, d) => u.slots.some(x => x.groupId === g.id && x.dow === d);
    const seat = (g, d) => { // worst case over the month's dates for that weekday
      const ds = E.monthDates(u.month).filter(x => x.dow === d && !(S.settings.closedDates || []).includes(x.key));
      if (!ds.length) return null;
      const inf = ds.map(x => E.seatInfo(S, g.id, x.key, { studentId: u.studentId, today: td, excludeId: u.editingId }));
      return inf.reduce((a, b) => (b.free < a.free ? b : a));
    };
    const cell = (g, d) => {
      const on = isOn(g, d), i = seat(g, d), full = i && i.free <= 0;
      return `<button class="wk-slot ${on ? 'on' : ''} ${full && !on ? 'full' : ''}" data-act="pickCell" data-id="${g.id}" data-dow="${d}" aria-pressed="${on}">
        <b>${on ? '✓ ' : ''}${esc(g.code)}</b><span>${g.start}–${g.end}</span>
        <small>${i ? (full ? t('wk_full') : t('wk_free', { f: Math.max(0, i.free), c: i.capacity })) : ''}${i && i.renewalHold ? ' · ' + t('wk_hold', { n: i.renewalHold }) : ''}</small>
        <small class="muted">${esc(roomName(g.roomId))}</small></button>`;
    };
    const cols = order.map(d => {
      const gs = groups.filter(g => g.days.includes(d)).sort((a, b) => a.start.localeCompare(b.start) || a.code.localeCompare(b.code));
      return `<div class="wk-col ${d === 0 ? 'sun' : ''}"><div class="wk-day">${dl(d)}</div><div class="wk-list">${gs.map(g => cell(g, d)).join('')}</div></div>`;
    }).join('');
    const quick = groups.filter(g => g.days.length > 1).map(g => {
      const all = g.days.every(d => isOn(g, d)), on = g.days.filter(d => isOn(g, d));
      const nChips = g.days.length > 2 ? g.days.slice(0, -1).map((_, i) => { const n = i + 1, ds = g.days.slice(0, n), sel = on.length === n && ds.every(d => isOn(g, d));
        return `<button class="chip sm ${sel ? 'on' : ''}" data-act="pickGroupN" data-id="${g.id}" data-n="${n}">${t('wk_nDays', { n })} (${ds.map(dn).join('+')})</button>`; }).join('') : '';
      return `<span class="tiny muted">${esc(g.code)}:</span>${nChips}<button class="chip sm ${all ? 'on' : ''}" data-act="pickGroupAll" data-id="${g.id}">${t('wk_allDays')} (${g.days.map(dn).join('+')})</button>`;
    }).join('<span style="width:10px"></span>');
    return `<div class="card"><div class="spaced"><h3>${t('wk_title')}</h3><div class="flex"><span class="tag">${t('wk_sel', { n: u.slots.length })}</span><button class="btn sm" data-act="slotsClear">${t('e_clear')}</button></div></div>
      <p class="note">${t('wk_level', { l: lv(lvl) })} · ${t('wk_note')}</p>
      ${quick ? `<div class="flex wrap" style="margin:6px 0 10px"><span class="tiny muted">${t('wk_quick')}:</span>${quick}</div>` : ''}
      <div class="wk-grid" style="--wk-n:${order.length}">${cols}</div></div>`;
  }
  /** v0.56 first class of a new course, right above the calendar: shows it and lets you start earlier (e.g. Mon 30/11 instead of Wed 2/12) */
  function firstDayBox() {
    const u = ui.enroll, td = today(), reg = u.sessions.filter(x => !x.makeup).map(x => x.date).sort(), first = reg[0];
    const closed = new Set(S.settings.closedDates || []), low = [u.bookDate, u.regDate].filter(Boolean).concat([td]).sort()[0];
    const opts = [];
    if (first) for (let d = E.addDays(first, -13); d < first; d = E.addDays(d, 1)) {
      if (d < low || closed.has(d)) continue;
      if (u.slots.some(sl => sl.dow === E.dowOf(d) && !E.classOff(S, sl.groupId, d))) opts.push(d);

    const mb = $('#mbar'); if (mb) mb.innerHTML = [['dashboard', '▦', 'mb_today'], ['attendance', '☑', 'qa_att'], ['enroll', '✎', 'qa_enroll'], ['finance', '฿', 'qa_pay']].map(([pg, ic, k]) => `<button data-act="go" data-page="${pg}" class="${ui.page === pg ? 'on' : ''}"><i>${ic}</i><span>${t(k)}</span></button>`).join('') + `<button data-act="mbMenu"><i>☰</i><span>${t('mb_menu')}</span></button>`;

    const L = S.settings.lang || 'th';
    $('#lang').innerHTML = [['th', 'ไทย'], ['en', 'EN'], ['both', 'ไทย/EN']].map(([k, n]) => `<button data-act="setLang" data-l="${k}" class="${L === k ? 'on' : ''}" aria-pressed="${L === k}">${n}</button>`).join('');
    $('#view').innerHTML = (hkNotice ? `<div class="alert info">🔔 ${esc(hkNotice)} <button class="btn sm" data-act="go" data-page="enroll" data-tab="wait">${t('e_tab_wait')}</button></div>` : '') + pages[ui.page]();

    $('#view').insertAdjacentHTML('beforeend', askHtml());
    const bf = $('#bill-file');

    const lf = $('#logo-file');

    document.querySelectorAll('input[data-act="thColor"]').forEach(el => { el.onchange = () => { PREF.theme = { ...(PREF.theme || {}), preset: 'custom', custom: el.value }; savePref(); render(); }; });
    const imp = $('#import-file');
    if (imp) imp.onchange = () => {
      const f = imp.files[0]; if (!f) return; const rd = new FileReader();
      rd.onload = () => { try { const s = JSON.parse(rd.result); if (![6, 7, 8, 9, 10, 11].includes(s.version) || !Array.isArray(s.enrollments)) throw 0; restoreState(s); ui.settingsDraft = null; toast(t('set_imported')); render(); } catch (e) { toast(t('set_bad'), 'err'); } };
      rd.readAsText(f);
    };
  }
  (() => { const b = document.createElement('div'); b.id = 'mbar'; b.className = 'mbar noprint'; document.body.appendChild(b);
    const u = document.createElement('div'); u.id = 'undo'; u.className = 'undo noprint'; u.hidden = true; document.body.appendChild(u); })();
  /* v0.49 undo: every click that saves keeps the data as it was just before, for 8 seconds */
  const NO_UNDO = new Set(['undo', 'restoreText', 'pinUnlock', 'pinRecover', 'pinSet', 'pinRemove', 'pinIdle', 'pinLockNow', 'setLang', 'setMode', 'copyText', 'copyBackup', 'exportJson']);
  let undoSnap = null, undoT = null;
  function showUndo() { const u = $('#undo'); if (!u) return; u.innerHTML = `<span>✓ ${t('ud_saved')}</span><button data-act="undo">${t('ud_undo')}</button>`; u.hidden = false; clearTimeout(undoT); undoT = setTimeout(() => { u.hidden = true; undoSnap = null; }, 8000); }
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
    const fn = A[el.dataset.act]; if (!fn) return;
    if (el.tagName !== 'INPUT') ev.preventDefault();
    const act = el.dataset.act, rev0 = S._rev, snap = NO_UNDO.has(act) || locked ? null : JSON.stringify(S);
    fn(el.dataset, el); render();
    if (snap && S._rev !== rev0 && !otherTabSaved) { undoSnap = snap; showUndo(); }
  });
  function bind(ev) {
    const el = ev.target; if (!el.dataset || !el.dataset.bind) return;
    setPath(el.dataset.bind, el.value);
    if (el.dataset.bind === 'students.form.code') ui.students.form.autoCode = false;
    if (el.dataset.bind === 'students.form.level' && ui.students.form && ui.students.form.autoCode) {
      const f = ui.students.form; f.code = E.nextStudentCode({ ...S, students: S.students.filter(s => s.id !== f.id) }, f.level);
    }
    if (el.dataset.bind === 'enroll.studentId' || el.dataset.bind === 'enroll.level') {
      if (!ui.enroll.editingId) { const keep = { studentId: ui.enroll.studentId, month: ui.enroll.month, level: ui.enroll.level }; resetEnroll(keep); }
    }
    if (el.dataset.bind === 'enroll.month' && !ui.enroll.editingId && /^\d{4}-\d{2}$/.test(ui.enroll.month)) { // keep the picked days, move them to the new month
      const u = ui.enroll; u.sessions = E.autoSessions(S, u.slots, u.month, monthFrom()); u.confirmed = false; u.mkDate = '';
    }
    if (el.dataset.bind === 'enroll.monthStart' && !ui.enroll.editingId && ev.type === 'change') startFrom(ui.enroll.monthStart);
    if (el.dataset.bind === 'enroll.firstDay' && !ui.enroll.editingId && ev.type === 'change') { startFrom(ui.enroll.firstDay); render(); }
    if (el.dataset.bind === 'enroll.bookDate' && !ui.enroll.editingId) { const u = ui.enroll; u.askDone = false;
      if (u.kind === 'month') u.sessions = E.normalizeSessions(E.autoSessions(S, u.slots, u.month, monthFrom()).concat(u.sessions.filter(x => x.makeup))); }

    const cm = /^books\.d\.lines\.(\d+)\.cat$/.exec(el.dataset.bind); if (cm && ui.books.d && ui.books.d.lines[+cm[1]]) { ui.books.d.lines[+cm[1]].auto = false; if (ev.type === 'change') render(); }
    if (ev.type === 'change' && (el.hasAttribute('data-live') || el.hasAttribute('data-live-change'))) render();
  }
  document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target && ev.target.id === 'pin-in') { bind(ev); const b = document.querySelector('.lock-card .btn.primary'); if (b) b.click(); } });
  document.addEventListener('change', ev => { const el = ev.target; if (!el || el.type !== 'file') return; const f = el.files && el.files[0]; if (!f) return;
    if (!/^image\//.test(f.type)) { toast(t('sl_notImage'), 'err'); return; }
    if (el.id === 'slip-file') prepSlip(f).then(sl => { ui.finance.slipPending = sl; render(); }).catch(() => toast(t('sl_notImage'), 'err'));
    else if (el.classList.contains('slip-add')) { const pid = el.dataset.id; prepSlip(f).then(sl => { const d = slipDup(sl, pid); const go = () => { attachSlip(pid, sl); ui.finance.slipImg = undefined; }; if (d) { askBox(t('sl_dupQ', { n: d.receiptNo }), go); render(); } else go(); }).catch(() => toast(t('sl_notImage'), 'err')); } });
  document.addEventListener('input', bind);
  document.addEventListener('change', ev => { const el = ev.target; if (el && el.dataset && el.dataset.actChange === 'subSet') {
    const r = E.setSubstitute(S, el.dataset.id, el.dataset.date, el.value, today()); if (r.ok) { save(); toast(t('sb_done')); } render(); } });
  document.addEventListener('change', bind);
  // v0.39 quick search: students and enquiries by name, nickname, code or phone
  const qs = $('#qs'), qsr = $('#qsr');
  function qsRun() {
    const q = qs.value.trim().toLowerCase(), qd = q.replace(/\D/g, '');
    if (!q) { qsr.hidden = true; return; }
    const hit = x => [x.name, x.nickname, x.code].some(v => String(v || '').toLowerCase().includes(q)) || (qd.length >= 3 && [x.parentPhone, x.phone, x.parent2Phone].some(v => String(v || '').replace(/\D/g, '').includes(qd)));
    const st = S.students.filter(hit).slice(0, 8), ld = (S.leads || []).filter(l => !['enrolled'].includes(l.status) && hit(l)).slice(0, 4);
    qsr.innerHTML = st.map(x => { const bal = S.enrollments.filter(e => e.studentId === x.id && e.status === 'approved').reduce((a, e) => a + E.balance(S, e), 0);
      return `<button data-qs-st="${x.id}"><b>${esc(x.name)}</b>${x.nickname ? ' (' + esc(x.nickname) + ')' : ''} <span class="tiny muted">${esc(x.code)} · ${lv(x.level)}${E.studentStatus(x) !== 'active' ? ' · ' + t('ss_' + E.studentStatus(x)) : ''}</span>${bal > 0 ? ` <span class="badge b-rejected">${money(bal)}</span>` : ''}</button>`; }).join('')
      + ld.map(l => `<button data-qs-lead="${l.id}"><span class="badge b-offered">${t('qs_lead')}</span> <b>${esc(l.name || l.nickname)}</b> <span class="tiny muted">${esc(l.phone || '')} · ${t('ls_' + l.status)}</span></button>`).join('')
      || `<div class="tiny muted" style="padding:10px">${t('qs_none')}</div>`;
    qsr.hidden = false;
  }
  qs.addEventListener('input', qsRun);
  qs.addEventListener('keydown', ev => { if (ev.key === 'Escape') { qs.value = ''; qsr.hidden = true; } if (ev.key === 'Enter') { const f = qsr.querySelector('button'); if (f) f.click(); } });
  qsr.addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.qsSt) A.viewStudent({ id: b.dataset.qsSt }); else if (b.dataset.qsLead) { ui.page = 'leads'; ui.leads.show = 'all'; }
    qs.value = ''; qsr.hidden = true; render(); });
  document.addEventListener('click', ev => { if (!ev.target.closest || !ev.target.closest('.qs')) qsr.hidden = true; });
  // v0.32 a field that re-renders on blur used to swallow the very next click (the button was redrawn between press and release).
  // If the pressed button was replaced, repeat the click on its twin under the pointer.
  let pressed = null;
  document.addEventListener('pointerdown', ev => { pressed = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null; }, true);
  document.addEventListener('pointerup', ev => {
    const p0 = pressed; pressed = null;
    if (!p0 || p0.isConnected) return;
    const el = document.elementFromPoint(ev.clientX, ev.clientY), twin = el && el.closest ? el.closest('[data-act]') : null;
    if (twin && twin !== p0 && twin.dataset.act === p0.dataset.act && JSON.stringify(twin.dataset) === JSON.stringify(p0.dataset)) setTimeout(() => twin.click(), 0);
  }, true);
  render();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.__summit = { get state() { return S; }, ui, E, save: () => { save(); render(); } }; // test hook (demo only)
})();
